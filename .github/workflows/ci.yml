name: Security and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and audit tool
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip check
      - name: Audit Python dependencies
        run: python -m pip_audit
      - name: Run tests
        run: python -m pytest -q
      - name: Check committed legal texts are complete
        run: |
          python - <<'PY'
          from pathlib import Path
          minimums = {
              "AGPL-3.0.txt": 20_000,
              "GPL-3.0.txt": 20_000,
              "LGPL-3.0.txt": 5_000,
              "Apache-2.0.txt": 8_000,
              "Lucide-ISC.txt": 500,
          }
          for name, minimum in minimums.items():
              size = (Path("LICENSES") / name).stat().st_size
              assert size >= minimum, f"{name} appears incomplete ({size} bytes)"
          PY
